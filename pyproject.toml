[project]
name = "ai-livestream-agent"
version = "2.0.0"
description = "本地 AI 互动直播执行引擎与桌面控制台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "cryptography>=43.0.0",
    "pyahocorasick>=2.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "psutil>=6.0.0",
    "edge-tts>=7.0.0",
    "numpy>=2.0.0",
    "Brotli>=1.1.0",
    "pypinyin>=0.50.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.0.0",
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.0.0",
    "soundfile>=0.12.0",
    "openpyxl>=3.1.0",
]
media = [
    "opencv-python>=4.10.0",
    "pyvirtualcam>=0.11.0",
    "Pillow>=10.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "onnxruntime>=1.19.0",
    "soundfile>=0.12.0",
    "mediapipe>=0.10.14",
    "sounddevice>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["server"]
branch = true
omit = [
  "server/tests/*",
  "server/**/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 55
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "F401", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
follow_imports = "silent"

