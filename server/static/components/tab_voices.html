      <div class="tab-content" id="tab-voices">
        <!-- 音频物理输出与虚拟声卡配置卡片 (规划 §7.1/§7.2) -->
        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">
              <svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              直播音频物理输出与虚拟声卡 (OBS 直连 · 防串音 AEC)
            </span>
            <span id="audio-device-badge" class="brand-badge green">正在检测设备...</span>
          </div>
          <div class="grid-2" style="align-items: flex-end; margin-bottom: 12px;">
            <div>
              <label class="form-label" for="audio-device-select">音频输出设备 / 虚拟声卡通道：</label>
              <select id="audio-device-select" class="form-control" title="音频输出设备选择" aria-label="音频输出设备选择">
                <option value="">系统默认音频播放设备</option>
              </select>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-primary" onclick="saveAudioDeviceSelection()">
                <svg class="icon-sm" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                切换并应用该设备
              </button>
              <button class="btn btn-sm" onclick="loadAudioDevices()">
                <svg class="icon-sm" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                刷新设备
              </button>
            </div>
          </div>
          <div style="font-size: 12px; color: var(--text-dim); line-height: 1.6;">
            💡 <strong>推流防串音提示</strong>：若使用 OBS Studio 推流，推荐选择虚拟声卡 <code>CABLE Input (VB-Audio Virtual Cable)</code>，并在 OBS 中添加“音频输入采集”抓取 <code>CABLE Output</code>，彻底消除麦克风啸叫与回声循环。
          </div>
        </div>

        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              音色克隆工厂 · 上传声音 → 一键克隆 → 在线试听
            </span>
            <span id="voice-edit-hint" style="font-size:12px;color:var(--amber);font-weight:500;"></span>
          </div>
          <div class="grid-3" style="margin-bottom: 16px;">
            <div>
              <label class="form-label" for="voice-name">音色名称 <span style="color:var(--red)">*</span></label>
              <input type="text" id="voice-name" class="form-control" placeholder="如：我的专属温柔女声" title="音色名称" aria-label="音色名称">
            </div>
            <div>
              <label class="form-label" for="voice-file">声音样本（10 秒清晰人声）<span style="color:var(--red)">*</span></label>
              <input type="file" id="voice-file" class="form-control" accept="audio/*" title="声音样本文件" aria-label="声音样本文件">
            </div>
            <div>
              <label class="form-label" for="voice-speed">语速：<span id="voice-speed-val" style="font-family:var(--font-mono);">1.0x</span></label>
              <input type="range" id="voice-speed" min="0.8" max="1.3" step="0.05" value="1.0" style="width: 100%; margin-top: 14px;" oninput="document.getElementById('voice-speed-val').innerText = this.value + 'x'" title="语速调节" aria-label="语速调节">
            </div>
          </div>
          <div style="display: flex; gap: 12px;">
            <button class="btn btn-primary" onclick="submitVoice()">
              <svg class="icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              上传声音样本（自动克隆）
            </button>
            <button class="btn" id="voice-reset-btn" onclick="resetVoiceForm()" style="display:none;">取消编辑</button>
            <input type="hidden" id="voice-edit-id" value="">
          </div>
        </div>

        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">音色资产库</span>
            <button class="btn btn-sm" onclick="loadVoiceTable()">
              <svg class="icon-sm" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              刷新
            </button>
          </div>
          <table class="data-table">
            <thead><tr><th>音色名称</th><th>语速</th><th>克隆状态</th><th>操作</th></tr></thead>
            <tbody id="voices-tbody"></tbody>
          </table>
        </div>
      </div>
