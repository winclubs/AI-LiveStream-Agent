      <div class="tab-content" id="tab-guardrails">
        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              违禁词批量添加 <span style="font-weight:400;color:var(--text-muted);font-size:12px;">（全直播间 · 所有 AI 角色通用）</span>
            </span>
          </div>
          <p class="page-intro">
            目的：让主播在直播期间<strong>禁止说出</strong>列表中的词汇，避免平台违规。
            多个违禁词请用<strong>英文逗号 ( , )</strong>隔开，可一次无限量添加。
          </p>
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 18px; margin-bottom: 16px;">
            <div>
              <label class="form-label" for="batch-words">违禁词（英文逗号分隔）<span style="color:var(--red)">*</span></label>
              <textarea id="batch-words" class="form-control" rows="3" placeholder="最好, 第一, 顶级, 国家级, 治愈, 根治" title="违禁词" aria-label="违禁词"></textarea>
            </div>
            <div>
              <label class="form-label" for="batch-replacement">合规替换词</label>
              <input type="text" id="batch-replacement" class="form-control" placeholder="如：深受大家喜爱" title="合规替换词" aria-label="合规替换词">
              <div class="field-tip">留空替换词 = 整句阻断（AI 不说出该句）</div>
              <label class="form-label" for="batch-category" style="margin-top: 12px;">分类</label>
              <select id="batch-category" class="form-control" title="违禁词分类" aria-label="违禁词分类">
                <option value="extreme">广告法极限词</option>
                <option value="medical">医疗功效</option>
                <option value="traffic">导流违规</option>
                <option value="competitor">竞品贬低</option>
                <option value="sensitive">敏感信息</option>
              </select>
            </div>
          </div>
          <button class="btn btn-primary" onclick="submitBatchWords()">
            <svg class="icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            添加违禁词
          </button>
          <span id="batch-words-status" style="font-size: 12px; color: var(--text-muted); margin-left: 12px;"></span>
        </div>

        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">当前违禁词库 <span style="font-weight:400;color:var(--text-muted);font-size:12px;">（<span id="guardrail-count">0</span> 条 · 全角色通用）</span></span>
            <button class="btn btn-sm" onclick="loadGuardrailWords()">
              <svg class="icon-sm" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              刷新
            </button>
          </div>
          <table class="data-table">
            <thead><tr><th>违禁词</th><th>分类</th><th>动作</th><th>合规替换词</th><th>操作</th></tr></thead>
            <tbody id="guardrail-tbody"></tbody>
          </table>
        </div>

        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">在线合规测试</span>
          </div>
          <div style="display: flex; gap: 12px; margin-bottom: 14px;">
            <input type="text" id="sanitize-input" class="form-control" placeholder="输入测试文本，如：我们的大衣是全网第一好看，价格最好！" title="合规测试输入文本" aria-label="合规测试输入文本">
            <button class="btn btn-primary" onclick="testSanitize()">测试拦截效果</button>
          </div>
          <div id="sanitize-result"></div>
        </div>
      </div>
