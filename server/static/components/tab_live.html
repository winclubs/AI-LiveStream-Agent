      <div class="tab-content" id="tab-live">

        <!-- 运营参数看板 -->
        <div id="live-stats-grid" class="grid-4">
          <div class="stat-cell">
            <div class="stat-cell-label">直播类型（模式）</div>
            <div class="stat-cell-value" id="stat-mode">—</div>
          </div>
          <div class="stat-cell">
            <div class="stat-cell-label">直播是谁（主播）</div>
            <div class="stat-cell-value" id="stat-anchor">—</div>
          </div>
          <div class="stat-cell">
            <div class="stat-cell-label">直播时长</div>
            <div class="stat-cell-value" style="font-family: var(--font-mono);" id="stat-duration">00:00:00</div>
          </div>
          <div class="stat-cell">
            <div class="stat-cell-label">网络状态</div>
            <div class="stat-cell-value" id="stat-network">—</div>
          </div>
          <div class="stat-cell">
            <div class="stat-cell-label">当前场观（最高）</div>
            <div class="stat-cell-value num" style="color: var(--signal);" id="stat-viewers">0</div>
          </div>
          <div class="stat-cell">
            <div class="stat-cell-label">打赏收益</div>
            <div class="stat-cell-value num" style="color: var(--amber);" id="stat-gift">¥0.00</div>
          </div>
          <div class="stat-cell">
            <div class="stat-cell-label">成交额 GMV</div>
            <div class="stat-cell-value num" style="color: var(--sky);" id="stat-gmv">¥0.00</div>
          </div>
          <div class="stat-cell">
            <div class="stat-cell-label">弹幕量 / 违规拦截</div>
            <div class="stat-cell-value num" id="stat-volume">0 / <span style="color: var(--red);">0</span></div>
          </div>
        </div>

        <!-- 成交登记 -->
        <div class="panel-card" style="display:flex; align-items:center; gap: 14px; flex-wrap: wrap;">
          <span style="font-size: 13px; font-weight: 700; display:inline-flex; align-items:center; gap:8px;">
            <svg class="icon" style="color: var(--amber);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><line x1="12" y1="6" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="18"/></svg>
            成交登记
          </span>
          <input type="number" id="order-amount" class="form-control" style="width: 150px;" placeholder="金额（元）" min="0.01" step="0.01" title="成交金额（元）" aria-label="成交金额（元）">
          <input type="text" id="order-sku" class="form-control" style="width: 190px;" placeholder="商品 SKU（必填）" required title="商品 SKU" aria-label="商品 SKU">
          <button class="btn btn-sm btn-primary" onclick="registerOrder()">登记成交 · 计入 GMV</button>
          <span style="font-size: 12px; color: var(--text-muted);">观众在小黄车下单后，在此登记以累计成交额</span>
        </div>

        <!-- 数字人监视器 -->
        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title" style="gap: 12px;">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49"/><path d="M7.76 16.24a6 6 0 0 1 0-8.49"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 19.07a10 10 0 0 1 0-14.14"/></svg>
              数字人实时流式视窗
              <span id="live-state-badge" class="badge-optional" style="font-weight: 600;">○ 待机未开播</span>
            </span>
            <div style="display: flex; align-items: center; gap: 10px;">
              <select id="live-platform-select" class="form-control" style="width: 128px; padding: 7px 8px; font-size: 12px;" title="选择直播平台" aria-label="选择直播平台">
                <option value="bilibili">B站直播</option>
                <option value="douyin">抖音直播</option>
                <option value="relay">其他平台(中继)</option>
              </select>
              <input type="text" id="live-room-input" class="form-control" style="width: 160px; padding: 7px 11px; font-size: 12px;" placeholder="房间号/链接（留空仿真）" title="房间号或直播链接" aria-label="房间号或直播链接">
              <label style="display: flex; align-items: center; gap: 5px; font-size: 12px; cursor: pointer; user-select: none; margin: 0 4px;" title="开播时通过 OBS WebSocket 联动开启 OBS 推流">
                <input type="checkbox" id="obs-auto-link-check" style="cursor: pointer;">
                <span style="color: var(--text-secondary);">OBS联动</span>
              </label>
              <button class="btn btn-sm" onclick="runPreflight({ auto: false })" title="开播前逐项检查模式/角色/AI/OBS/商品等开播条件">
                <svg class="icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                开播前检查
              </button>
              <button id="btn-toggle-live" class="btn btn-sm btn-primary" onclick="toggleLiveState()">
                <svg class="icon-sm" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                启动本地直播源
              </button>
            </div>
          </div>

          <div class="monitor-screen" style="position: relative; overflow: hidden; background: #000; min-height: 420px; display: flex; align-items: center; justify-content: center;">
            <!-- 实时数字人视频流 / 待机图 -->
            <img id="digital-human-video-feed" src="/static/svg/standby_monitor.svg" alt="数字人监视画面" style="width: 100%; height: 100%; max-height: 480px; object-fit: contain; transition: opacity 0.3s ease;">

            <!-- 商品业务场景画层：仅表示控制台真实渲染，不冒充平台推流切镜 -->
            <div id="coupon-overlay" class="coupon-overlay" style="display:none;">
              <div id="coupon-overlay-title" class="coupon-overlay-title">限时优惠</div>
              <div id="coupon-overlay-countdown" class="coupon-overlay-countdown">03:00</div>
              <button type="button" class="scene-overlay-close" onclick="closeCouponOverlay()" aria-label="关闭优惠券画层">×</button>
            </div>
            <div id="product-scene-overlay" class="product-scene-overlay" style="display:none;">
              <button type="button" class="scene-overlay-close" onclick="closeSceneOverlay()" aria-label="关闭商品画层">×</button>
              <div id="scene-overlay-content" class="scene-overlay-content"></div>
            </div>
            
            <!-- 顶部半透明浮动遥测栏 -->
            <div style="position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; pointer-events: none;">
              <div style="display: flex; gap: 8px; align-items: center;">
                <span id="cam-status-badge" class="brand-badge" style="background: rgba(0,0,0,0.6); color: #fff;">摄像头状态检测中</span>
                <span id="stream-fps-badge" class="brand-badge" style="background: rgba(0,0,0,0.6); color: #fff; font-family: var(--font-mono);">25.0 FPS</span>
                <span id="obs-status-badge" class="brand-badge" style="background: rgba(0,0,0,0.6); color: #94A3B8; font-family: var(--font-mono); pointer-events: auto; cursor: pointer;" onclick="promptObsConnect()" title="点击连接/刷新 OBS-WebSocket 状态">OBS: 未连接</span>
              </div>
              <span id="stream-mode-badge" class="brand-badge" style="background: rgba(0,0,0,0.6); color: var(--signal); font-family: var(--font-mono);">数字人渲染</span>
            </div>

            <div class="barge-in-badge" id="barge-in-badge">[抢占打断] P0 礼物感谢</div>
            <div class="speaking-wave-box">
              <span id="speaking-wave-text">语音驱动</span>
              <div class="wave-bars">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 弹幕瀑布流 -->
        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">
              <svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
              P0~P3 优先级弹幕互动瀑布流
            </span>
            <div style="display: flex; gap: 10px;">
              <button class="btn btn-sm" onclick="sendMockDanmaku('danmaku')">模拟促单提问（P1）</button>
              <button class="btn btn-sm btn-primary" onclick="sendMockDanmaku('gift')">
                <svg class="icon-sm" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                模拟大额打赏（P0 打断）
              </button>
            </div>
          </div>
          <div class="danmaku-stream-box" id="danmaku-stream"></div>
        </div>

        <!-- 运营人工插播 -->
        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">
              <svg class="icon" style="color: var(--amber);" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              运营人工紧急插播（Barge-in 打断）
            </span>
          </div>
          <p class="page-intro" style="margin-bottom: 14px;">
            发生直播突发情况或需要紧急改口时，输入内容可<strong>瞬时打断当前正在发音的数字人</strong>，优先播报该话术。
          </p>
          <div style="display: flex; gap: 14px; align-items: flex-start;">
            <textarea id="manual-speech-input" class="form-control" rows="3" style="flex: 1;" placeholder="输入插播话术，例如：宝子们不要着急，刚才网络有点卡顿，我们马上上专属大额优惠券！" title="紧急插播话术" aria-label="紧急插播话术"></textarea>
            <button class="btn btn-primary" style="min-width: 170px; height: fit-content;" onclick="sendManualSpeech()">立即抢占打断并播报</button>
          </div>
        </div>
      </div>
