<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 背景深邃温润暖炭黑渐变 -->
    <linearGradient id="shakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <!-- 金色高光手渐变 (右手) -->
    <linearGradient id="handGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <!-- 暖色手部渐变 (左手) -->
    <linearGradient id="handWarm" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <!-- 袖口渐变 -->
    <linearGradient id="sleeveL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="sleeveR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shakeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 外圆与背景 -->
  <circle cx="60" cy="60" r="56" fill="url(#shakeBg)" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- 上方友好互动光波/对话共振微弧 -->
  <path d="M 52 32 Q 60 27 68 32" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 47 26 Q 60 19 73 26" fill="none" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.5"/>
  <!-- 亲切共鸣火花/小爱心 -->
  <circle cx="60" cy="35" r="2" fill="#FDE047"/>

  <!-- 握手主体 (Handshake) -->
  <g filter="url(#shakeGlow)">
    <!-- 左侧手腕与袖口 (自左下延伸至右上) -->
    <path d="M 24 68 L 36 56 L 46 66 L 34 78 Z" fill="url(#sleeveL)" stroke="#78716C" stroke-width="1"/>
    <!-- 左袖口白边/手表圈 -->
    <line x1="36" y1="56" x2="46" y2="66" stroke="#E7E5E4" stroke-width="2" stroke-linecap="round"/>

    <!-- 右侧手腕与袖口 (自右下延伸至左上) -->
    <path d="M 96 68 L 84 56 L 74 66 L 86 78 Z" fill="url(#sleeveR)" stroke="#92400E" stroke-width="1"/>
    <!-- 右袖口金边 -->
    <line x1="84" y1="56" x2="74" y2="66" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>

    <!-- 相互交握的手掌与手指 -->
    <!-- 左手手掌延伸与大拇指 -->
    <path d="M 46 66 C 50 62, 54 52, 58 48 C 60 46, 63 47, 63 49 C 62 53, 58 60, 56 64 Z" fill="url(#handWarm)"/>

    <!-- 右手大拇指与手背紧握交叠 -->
    <path d="M 74 66 C 70 62, 66 52, 62 48 C 60 46, 57 47, 57 49 C 58 53, 62 60, 64 64 Z" fill="url(#handGold)"/>

    <!-- 四指相扣握合部 (立体扣环细节) -->
    <!-- 手指 1 -->
    <rect x="49" y="60" width="16" height="5.5" rx="2.5" fill="url(#handGold)" transform="rotate(18 49 60)" stroke="#78350F" stroke-width="0.7"/>
    <!-- 手指 2 -->
    <rect x="52" y="66" width="15" height="5.5" rx="2.5" fill="url(#handGold)" transform="rotate(18 52 66)" stroke="#78350F" stroke-width="0.7"/>
    <!-- 手指 3 -->
    <rect x="55" y="72" width="14" height="5" rx="2.5" fill="url(#handGold)" transform="rotate(18 55 72)" stroke="#78350F" stroke-width="0.7"/>
    <!-- 手指 4 (小指) -->
    <rect x="58" y="77" width="12" height="4.5" rx="2.2" fill="url(#handGold)" transform="rotate(18 58 77)" stroke="#78350F" stroke-width="0.7"/>

    <!-- 手指背面握紧阴影线 -->
    <path d="M 45 66 C 48 72, 53 77, 58 80" fill="none" stroke="#78350F" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 底部标签 -->
  <rect x="25" y="96" width="70" height="18" rx="9" fill="#18181B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="60" y="108" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">闲聊扯淡</text>
</svg>
