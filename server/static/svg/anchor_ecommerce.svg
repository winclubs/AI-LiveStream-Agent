<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 背景深邃暖黑金渐变 -->
    <linearGradient id="orangeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1205"/>
      <stop offset="100%" stop-color="#140902"/>
    </linearGradient>
    <!-- 橘子果肉鲜亮渐变 -->
    <radialGradient id="orangeBody" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="25%" stop-color="#FB923C"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <!-- 绿叶渐变 -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <!-- 枝条渐变 -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A16207"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="orangeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 外圆与背景 -->
  <circle cx="60" cy="60" r="56" fill="url(#orangeBg)" stroke="#F97316" stroke-width="2"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#F97316" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.4"/>

  <!-- 底部微弱投影 -->
  <ellipse cx="60" cy="85" rx="26" ry="6" fill="#000000" opacity="0.35"/>

  <!-- 橘子主体 (圆润果身) -->
  <g filter="url(#orangeShadow)">
    <circle cx="60" cy="57" r="27" fill="url(#orangeBody)"/>
    <!-- 顶部果蒂凹陷弧度 -->
    <path d="M 52 35 C 57 37, 63 37, 68 35" fill="none" stroke="#9A3412" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- 鲜嫩高光点 -->
    <ellipse cx="48" cy="46" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.45" transform="rotate(-30 48 46)"/>
    <circle cx="43" cy="53" r="1.5" fill="#FFFFFF" opacity="0.35"/>
    <!-- 橘皮质感细节孔 -->
    <circle cx="72" cy="52" r="0.8" fill="#C2410C" opacity="0.6"/>
    <circle cx="68" cy="66" r="0.9" fill="#C2410C" opacity="0.6"/>
    <circle cx="56" cy="74" r="0.8" fill="#C2410C" opacity="0.6"/>
    <circle cx="46" cy="68" r="0.8" fill="#C2410C" opacity="0.6"/>
  </g>

  <!-- 枝条 -->
  <path d="M 60 36 C 60 31, 62 27, 65 24" fill="none" stroke="url(#stemGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- 绿叶一 (右大叶) -->
  <path d="M 62 33 C 74 24, 85 29, 84 37 C 76 43, 67 38, 62 33 Z" fill="url(#leafGrad)"/>
  <path d="M 62 33 Q 73 33 83 36" fill="none" stroke="#86EFAC" stroke-width="1" opacity="0.7"/>

  <!-- 绿叶二 (左小叶) -->
  <path d="M 58 35 C 50 30, 42 34, 43 40 C 49 43, 55 39, 58 35 Z" fill="url(#leafGrad)"/>
  <path d="M 58 35 Q 51 36 44 39" fill="none" stroke="#86EFAC" stroke-width="0.8" opacity="0.6"/>

  <!-- 底部标签 -->
  <rect x="25" y="96" width="70" height="18" rx="9" fill="#18181B" stroke="#F97316" stroke-width="1.2"/>
  <text x="60" y="108" fill="#F97316" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">带货主播</text>
</svg>
