<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 背景专业医学藏青黑渐变 -->
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- 医疗十字立体红渐变 -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="40%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <!-- 白色盾牌/圆盘底座渐变 -->
    <radialGradient id="discGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <!-- 发光滤镜 -->
    <filter id="medGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#EF4444" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 外圆与背景 -->
  <circle cx="60" cy="60" r="56" fill="url(#medBg)" stroke="#EF4444" stroke-width="2"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- 医疗守护圆形底板 -->
  <g filter="url(#medGlow)">
    <circle cx="60" cy="56" r="28" fill="url(#discGrad)" stroke="#EF4444" stroke-width="2.5"/>
    <!-- 内部同心装饰细环 -->
    <circle cx="60" cy="56" r="25" fill="none" stroke="#FCA5A5" stroke-width="0.8" stroke-dasharray="2 2"/>

    <!-- 医疗核心：标准圆角十字 (+) 几何路径 -->
    <!-- 中心 60, 56；总臂宽 32，粗度 12 -->
    <path d="
      M 54 40
      C 54 38.5, 55.5 37, 57 37 L 63 37 C 64.5 37, 66 38.5, 66 40 L 66 50
      L 76 50 C 77.5 50, 79 51.5, 79 53 L 79 59 C 79 60.5, 77.5 62, 76 62 L 66 62
      L 66 72 C 66 73.5, 64.5 75, 63 75 L 57 75 C 55.5 75, 54 73.5, 54 72 L 54 62
      L 44 62 C 42.5 62, 41 60.5, 41 59 L 41 53 C 41 51.5, 42.5 50, 44 50 L 54 50
      Z"
      fill="url(#crossGrad)"/>

    <!-- 十字顶部高光 -->
    <rect x="56" y="39" width="8" height="2" rx="1" fill="#FECACA" opacity="0.8"/>
    <rect x="43" y="52" width="2" height="6" rx="1" fill="#FECACA" opacity="0.8"/>

    <!-- 心电律动波线 (穿越十字下方的医疗脉冲波) -->
    <path d="M 36 56 L 46 56 L 50 48 L 54 64 L 60 42 L 65 67 L 69 53 L 74 56 L 84 56"
          fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- 专业星芒/守护点缀 -->
  <polygon points="60,20 61.5,23 64.5,23 62,25 63,28 60,26 57,28 58,25 55.5,23 58.5,23" fill="#38BDF8" opacity="0.8"/>
  <circle cx="34" cy="30" r="1.5" fill="#EF4444"/>
  <circle cx="86" cy="30" r="1.5" fill="#EF4444"/>

  <!-- 底部标签 -->
  <rect x="25" y="96" width="70" height="18" rx="9" fill="#18181B" stroke="#EF4444" stroke-width="1.2"/>
  <text x="60" y="108" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">专业专家</text>
</svg>
