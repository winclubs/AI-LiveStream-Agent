<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="customBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082b27"/>
      <stop offset="50%" stop-color="#091f1c"/>
      <stop offset="100%" stop-color="#050e0d"/>
    </linearGradient>
    <linearGradient id="customBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#customBg)" stroke="url(#customBorder)" stroke-width="1.2"/>
  <!-- Server / Custom Gateway & Audio Wave Icon (饱满居中) -->
  <g transform="translate(24, 24) scale(1.08) translate(-24, -24)">
    <rect x="11" y="11" width="26" height="8" rx="2.5" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="15.5" cy="15" r="1.5" fill="#34d399"/>
    <circle cx="19.5" cy="15" r="1.2" fill="#5eead4" opacity="0.7"/>
    <rect x="11" y="22" width="26" height="8" rx="2.5" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="15.5" cy="26" r="1.5" fill="#34d399"/>
    <!-- Audio wave indicator on bottom server -->
    <line x1="22" y1="26" x2="24" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="24.5" x2="28" y2="24.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="26" x2="32" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Wave Antenna / Port -->
    <path d="M19 34 C21.5 36.5, 26.5 36.5, 29 34" fill="none" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M16 38 C20.5 41.5, 27.5 41.5, 32 38" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
