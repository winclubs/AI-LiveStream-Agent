<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="monitorBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#132337"/>
      <stop offset="100%" stop-color="#080C14"/>
    </radialGradient>
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4A0" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2DD4A0" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#monitorBg)"/>
  <!-- 四角标线 -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#2DD4A0" stroke-width="2"/>
  <path d="M 360 20 L 380 20 L 380 40" fill="none" stroke="#2DD4A0" stroke-width="2"/>
  <path d="M 20 260 L 20 280 L 40 280" fill="none" stroke="#2DD4A0" stroke-width="2"/>
  <path d="M 380 260 L 380 280 L 360 280" fill="none" stroke="#2DD4A0" stroke-width="2"/>
  <!-- 面部识别网格与头部剪影 -->
  <circle cx="200" cy="120" r="42" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="200" cy="115" r="28" fill="#1E293B" stroke="#2DD4A0" stroke-width="1.5" opacity="0.9"/>
  <path d="M 155 195 C 155 160, 175 152, 200 152 C 225 152, 245 160, 245 195 Z" fill="#1E293B" stroke="#2DD4A0" stroke-width="1.5" opacity="0.9"/>
  <!-- 视线瞄准十字与网格 -->
  <line x1="180" y1="115" x2="220" y2="115" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="95" x2="200" y2="135" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
  <!-- 底部状态与波形 -->
  <text x="200" y="225" fill="#2DD4A0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">LIVE AVATAR ENGINE READY</text>
  <text x="200" y="244" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">本地程序化预览待命 · 外部平台发布待人工验收</text>
</svg>
